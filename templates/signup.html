<!DOCTYPE html><html><head><title>Student Signup | Intelligent Interview System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="site-shell"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">AI</span>Intelligent Interview System</a><div class="nav-links"><a href="/">Home</a><a href="/login">Login</a></div></nav><section class="form-card"><p class="eyebrow">Build your interview confidence</p><h1>Create Student Account</h1><p class="lead">Save your interview practice under your own account.</p>{% if error %}<p class="notice">{{ error }}</p>{% endif %}<form method="POST"><div class="field"><label for="name">Full Name</label><input id="name" name="name" type="text" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required></div><div class="field"><label for="confirm_password">Confirm Password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" required></div><button type="submit">Create Account</button></form><p class="footer-links">Already a student? <a href="/login">Log in</a> · <a href="/">Back to Home</a></p></section></main></body></html>
