<!DOCTYPE html><html><head><title>Mock Interview Setup | Intelligent Interview System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="site-shell"><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">AI</span>Intelligent Interview System</a><div class="nav-links"><a href="/">Home</a><a href="/trainer">Trainer</a><a href="/dashboard">Dashboard</a><form class="inline-form" action="/logout" method="POST"><button class="button-danger">Logout</button></form></div></nav><section class="form-card"><p class="eyebrow">Interview setup</p><h1>Prepare your mock interview</h1><p class="lead">Select your target role and our AI coach will tailor a five-question interview.</p>{% if error %}<p class="notice">{{ error }}</p>{% endif %}<form action="/start-interview" method="POST"><div class="field"><label for="job_role">Select Job Role</label><select id="job_role" name="job_role"><option value="software_developer">Software Developer</option><option value="web_developer">Web Developer</option><option value="python_developer">Python Developer</option><option value="data_analyst">Data Analyst</option><option value="software_tester">Software Tester</option></select></div><div class="field"><label for="interview_type">Select Interview Type</label><select id="interview_type" name="interview_type"><option value="hr">HR Interview</option><option value="technical">Technical Interview</option><option value="behavioral">Behavioral Interview</option><option value="mixed">Mixed Interview</option></select></div><div class="field"><label for="difficulty">Select Difficulty</label><select id="difficulty" name="difficulty"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div><button type="submit">Start Interview</button></form><p class="footer-links"><a href="/trainer">← Back to Trainer</a></p></section></main></body></html>
